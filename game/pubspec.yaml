name: cambric_game
description: "Cambric Game Template — a reusable 2D game foundation for Android, Windows, and Linux."
publish_to: 'none'

# Single authoritative version. Build number increments on every release.
version: 0.1.0+1

environment:
  sdk: ">=3.13.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Game engine ──────────────────────────────────────────────────────────
  flame: ^1.38.2
  flame_audio: ^2.12.2

  # Explicit platform audio plugins (works around audioplayers plugin registration bugs)
  audioplayers_windows: ^4.4.1
  audioplayers_linux: ^4.3.0

  # ── Storage ──────────────────────────────────────────────────────────────
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

  # ── Localization ─────────────────────────────────────────────────────────
  intl: ^0.20.3

  # ── Networking ───────────────────────────────────────────────────────────
  http: ^1.6.0

  # ── Security / integrity ─────────────────────────────────────────────────
  crypto: ^3.0.7

  # ── Utilities ────────────────────────────────────────────────────────────
  logging: ^1.3.0
  uuid: ^4.5.3
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.31.1

# jni 1.1.0 has a corrupted pub.dev artifact — the JniPlugin.java/kt file
# is missing from the package, causing flutter build to fail even for
# non-Android targets. Pinning to 1.0.3 which has the correct artifact.
# Remove this override when jni publishes a fixed release.
dependency_overrides:
  jni: 1.0.3
  jni_flutter: 1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/cambric.manifest.json
    - assets/i18n/en.json
    - assets/i18n/ar.json
    - assets/images/
    - assets/sprites/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/fonts/
