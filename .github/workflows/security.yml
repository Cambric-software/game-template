name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC

jobs:
  dependencies:
    name: Dependency and Secret Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: game
        run: flutter pub get

      # Updates are reported, not enforced. Dart has no built-in advisory
      # audit; use OSV-Scanner or a similar tool if you need CVE matching.
      - name: Report outdated dependencies
        working-directory: game
        run: dart pub outdated --no-dev-dependencies
        continue-on-error: true

      - name: Check for hardcoded secrets in Dart source
        working-directory: game
        run: |
          # Scan lib/ for patterns that suggest hardcoded credentials.
          # Uses POSIX ERE (-E) patterns compatible with ubuntu grep.
          FOUND=0
          grep -rEn \
            "SECRET[[:space:]]*=[[:space:]]*['\"]|PASSWORD[[:space:]]*=[[:space:]]*['\"]|API_KEY[[:space:]]*=[[:space:]]*['\"]|PRIVATE_KEY[[:space:]]*=[[:space:]]*['\"]" \
            --include="*.dart" \
            --exclude-dir="test" \
            lib/ && FOUND=1 || true
          if [ "$FOUND" = "1" ]; then
            echo "FAIL: Potential hardcoded secret found in source code"
            exit 1
          else
            echo "OK: No hardcoded secrets detected"
          fi

      - name: Check no .env files committed
        run: |
          if find . -name ".env" -not -path "*/.git/*" | grep -q .; then
            echo "FAIL: .env file found in repository"
            exit 1
          else
            echo "OK: No .env files found"
          fi
