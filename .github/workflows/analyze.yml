name: Analyze

on:
  push:
  pull_request:

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: game
        run: flutter pub get

      - name: Analyze
        working-directory: game
        run: |
          flutter analyze 2>&1 | tee analyze_output.txt
          # Fail only if there are real errors or warnings, not just info hints
          if grep -qE "^\s+(error|warning) -" analyze_output.txt; then
            echo "Errors or warnings found — failing."
            exit 1
          fi
          echo "Analyze passed (no errors or warnings)."
