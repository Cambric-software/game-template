name: Analyze

on:
  push:
  pull_request:

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: game
        run: flutter pub get

      - name: Analyze
        working-directory: game
        run: flutter analyze
