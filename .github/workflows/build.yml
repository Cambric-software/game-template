name: Build

# Builds all three platforms on every push to main and on every PR.
# Analyze and test must pass first (needs: [analyze, test] via ci.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: game
        run: flutter pub get

      - name: Build APK
        working-directory: game
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: game/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build-linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: game
        run: flutter pub get

      - name: Build Linux
        working-directory: game
        run: flutter build linux --release

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: game/build/linux/x64/release/bundle
          retention-days: 7

  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: game
        run: flutter pub get

      - name: Build Windows
        working-directory: game
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: game/build/windows/x64/runner/Release
          retention-days: 7

